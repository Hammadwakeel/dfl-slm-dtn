topology:
  default: directed_ring
  options:
    - directed_ring
    - bidirectional_ring
    - mesh
    - chain
    - star

dataset_splits:
  - name: dirichlet_a03
    alpha: 0.3
    seed: 2026
  - name: dirichlet_a05
    alpha: 0.5
    seed: 2026

optimizer:
  strategy: weighted_measured_reward
  reward_config: topology_opt/reward_config.json
  baselines:
    - random_seeded
    - best_observed_accuracy
