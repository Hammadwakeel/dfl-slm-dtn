[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfl-slm-dtn-backend"
version = "0.1.0"
description = "FastAPI digital twin coordinator for the DFL-SLM Jetson network"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.110,<1",
  "jsonschema>=4.22,<5",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10,<12",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.scripts]
dtn-backend = "app.main:main"

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = [".", "../.."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
